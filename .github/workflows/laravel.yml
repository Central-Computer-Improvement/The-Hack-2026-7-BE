name: Laravel CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: skillbridge
      DB_USERNAME: skillbridge
      DB_PASSWORD: root
      DB_URL: ""

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: skillbridge
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: skillbridge
          MYSQL_PASSWORD: root

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Create environment file
        run: |
          cp .env.example .env

          sed -i '/^DB_CONNECTION=/d' .env
          sed -i '/^DB_HOST=/d' .env
          sed -i '/^DB_PORT=/d' .env
          sed -i '/^DB_DATABASE=/d' .env
          sed -i '/^DB_USERNAME=/d' .env
          sed -i '/^DB_PASSWORD=/d' .env
          sed -i '/^DB_URL=/d' .env

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Clear Laravel configuration
        run: |
          php artisan config:clear
          

      - name: Show database configuration
        run: php artisan config:show database.connections.mysql

      - name: Test database connection
        run: php artisan db:show

      - name: Run migrations
        run: php artisan migrate:fresh --force

      - name: Run tests
        run: php artisan test