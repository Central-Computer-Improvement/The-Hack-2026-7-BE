name: Laravel CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: skillbridge
      DB_USERNAME: skillbridge
      DB_PASSWORD: root
      JWT_SECRET: skillbridge-ci-secret-key-2026-very-long

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: skillbridge
          MYSQL_ROOT_PASSWORD: root
          MYSQL_PASSWORD: root
          MYSQL_USER: skillbridge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Configure environment
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=skillbridge/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=skillbridge/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env

          sed -i '/^JWT_SECRET=/d' .env
          echo 'JWT_SECRET=skillbridge-ci-secret-key-2026-very-long' >> .env

          php artisan config:clear

      - name: Show environment configuration
        run: |
          echo "DB_CONNECTION=$DB_CONNECTION"
          echo "DB_HOST=$DB_HOST"
          echo "DB_PORT=$DB_PORT"
          echo "DB_DATABASE=$DB_DATABASE"
          echo "DB_USERNAME=$DB_USERNAME"
          echo "DB_PASSWORD is set: $([ -n "$DB_PASSWORD" ] && echo yes || echo no)"
          echo "JWT_SECRET is set: $([ -n "$JWT_SECRET" ] && echo yes || echo no)"

      - name: Show Laravel database configuration
        run: php artisan config:show database.connections.mysql

      - name: Test MySQL connection
        run: |
          mysqladmin ping \
            -h 127.0.0.1 \
            -P 3306 \
            -u skillbridge \
            -proot

      - name: Run migrations
        run: php artisan migrate:fresh --force

      - name: Run tests
        run: php artisan test
